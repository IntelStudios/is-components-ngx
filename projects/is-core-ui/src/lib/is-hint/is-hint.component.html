<ng-template #popTemplate>
  <div [innerHtml]="hintValue()"></div>
</ng-template>
@if (hint) {
  <button container="body" tabIndex="-1" [popover]="popTemplate" #popover="bs-popover" (onShown)="onPopoverShown()" (onHidden)="onPopoverHidden()" [popoverTitle]="hintTitle" [placement]="placement">
    <i [class]="icon"></i>
  </button>
}
