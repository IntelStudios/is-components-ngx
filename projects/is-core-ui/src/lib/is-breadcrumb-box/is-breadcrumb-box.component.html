@if (breadcrumb) {
  <a class="tile {{bgClass}}" [routerLink]="route">
    @if (breadcrumb.icon) {
      <div class="tile-body">
        <i [class]="breadcrumb.icon"></i>
      </div>
    } @else {
      <div class="tile-body no-icon">
        <div class="name-no-icon">{{breadcrumb.name}}</div>
      </div>
    }
    <div class="tile-object">
      @if (breadcrumb.icon) {
        <div class="name">{{breadcrumb.name}}</div>
      }
      @if (count) {
        <div class="number">{{count}}</div>
      }
    </div>
  </a>
}
